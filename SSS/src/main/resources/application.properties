spring.application.name=SSS

# ---- Aiven MySQL ----
# Get these values from your Aiven console -> Service overview.
# Aiven requires SSL, hence useSSL=true & requireSSL=true.
spring.datasource.url=${DB_URL}
# ^ No default on purpose — the app should fail loudly at startup if this
# isn't set rather than silently connecting nowhere. Set it to the FULL
# JDBC URL including SSL params, e.g.:
# jdbc:mysql://<host>:<port>/<db>?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# Must be at least 32 characters (HS256 needs a >=256-bit key). Override via
# env var in production — never commit a real secret.
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-in-prod-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ---- File uploads ----
# provider = local (default, zero setup, NOT durable across redeploys on most
# hosts) or s3 (durable — real AWS S3, or Cloudflare R2 via the endpoint
# override below, which is what this was written/tested against). See README
# for the full R2 setup walkthrough.
app.storage.provider=${STORAGE_PROVIDER:local}

# Used when app.storage.provider=local
app.upload-dir=${UPLOAD_DIR:./uploads}

# Used when app.storage.provider=s3 (all required in that mode)
app.storage.s3.region=${S3_REGION:auto}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.bucket=${S3_BUCKET:}
# The URL images are served back from — your R2 public bucket URL / custom
# domain, or https://<bucket>.s3.<region>.amazonaws.com for real S3.
app.storage.s3.public-base-url=${S3_PUBLIC_BASE_URL:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---- Default admin account (created on first boot if missing) ----
# Change ADMIN_PASSWORD via env var, and change it again after first login.
app.admin.email=${ADMIN_EMAIL:admin@thevault-jewelry.com}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}

# Server
server.port=${PORT:8181}
